<div class="ai-pet-sp-wrap" id="ai-pet-sp-wrap">

  <!-- 折叠头部 -->
  <div class="ai-pet-sp-header" id="ai-pet-sp-toggle" role="button" tabindex="0"
       aria-expanded="true" aria-controls="ai-pet-sp-body">
    <span class="ai-pet-sp-header__icon">🐾</span>
    <span class="ai-pet-sp-header__title">AI桌宠系统</span>
    <span class="ai-pet-sp-header__arrow" id="ai-pet-sp-arrow">▼</span>
  </div>

  <!-- 可折叠主体 -->
  <div class="ai-pet-sp-body" id="ai-pet-sp-body">

    <!-- ── 基础设置 ── -->
    <div class="ai-pet-sp-section">
      <div class="ai-pet-sp-section__title">基础设置</div>

      <div class="ai-pet-sp-row">
        <label class="ai-pet-sp-label" for="ai-pet-sp-enabled">启用插件</label>
        <label class="ai-pet-sp-switch" aria-label="启用插件">
          <input type="checkbox" id="ai-pet-sp-enabled">
          <span class="ai-pet-sp-switch__slider"></span>
        </label>
      </div>

      <div class="ai-pet-sp-row">
        <label class="ai-pet-sp-label" for="ai-pet-sp-mode">互动模式</label>
        <select class="ai-pet-sp-select" id="ai-pet-sp-mode">
          <option value="free">免费模式（无需API）</option>
          <option value="api">API模式（需要Key）</option>
        </select>
      </div>

      <div class="ai-pet-sp-row">
        <label class="ai-pet-sp-label" for="ai-pet-sp-theme">界面主题</label>
        <select class="ai-pet-sp-select" id="ai-pet-sp-theme">
          <option value="pink">🌸 粉白色系</option>
          <option value="dark">🌑 黑白色系</option>
        </select>
      </div>

      <div class="ai-pet-sp-row">
        <label class="ai-pet-sp-label" for="ai-pet-sp-loglevel">日志级别</label>
        <select class="ai-pet-sp-select" id="ai-pet-sp-loglevel">
          <option value="verbose">详细（verbose）</option>
          <option value="error">仅报错（error）</option>
        </select>
      </div>
    </div>

    <!-- ── API 配置 ── -->
    <div class="ai-pet-sp-section">
      <div class="ai-pet-sp-section__title">API 配置</div>

      <div class="ai-pet-sp-row ai-pet-sp-row--col">
        <label class="ai-pet-sp-label" for="ai-pet-sp-baseurl">Base URL</label>
        <input class="ai-pet-sp-input" type="text" id="ai-pet-sp-baseurl"
               placeholder="https://api.openai.com/v1" autocomplete="off" spellcheck="false"/>
      </div>

      <div class="ai-pet-sp-row ai-pet-sp-row--col">
        <label class="ai-pet-sp-label" for="ai-pet-sp-apikey">API Key</label>
        <input class="ai-pet-sp-input" type="password" id="ai-pet-sp-apikey"
               placeholder="sk-..." autocomplete="off" spellcheck="false"/>
      </div>

      <div class="ai-pet-sp-row ai-pet-sp-row--col">
        <label class="ai-pet-sp-label" for="ai-pet-sp-model">模型选择</label>
        <div class="ai-pet-sp-model-row">
          <select class="ai-pet-sp-select ai-pet-sp-select--grow" id="ai-pet-sp-model" disabled>
            <option value="">— 请先获取模型列表 —</option>
          </select>
          <button class="ai-pet-sp-btn" id="ai-pet-sp-fetch-models">获取模型</button>
        </div>
        <div class="ai-pet-sp-status" id="ai-pet-sp-model-status"></div>
      </div>

      <div class="ai-pet-sp-row">
        <button class="ai-pet-sp-btn ai-pet-sp-btn--full" id="ai-pet-sp-test-api">
          🔌 测试连接
        </button>
      </div>
      <div class="ai-pet-sp-status" id="ai-pet-sp-test-status"></div>
    </div>

    <!-- ── 消息模板 ── -->
    <div class="ai-pet-sp-section">
      <div class="ai-pet-sp-section__title">消息信息模板</div>
      <div class="ai-pet-sp-row ai-pet-sp-row--col">
        <label class="ai-pet-sp-label" for="ai-pet-sp-template">模板内容</label>
        <textarea class="ai-pet-sp-textarea" id="ai-pet-sp-template" rows="3"
                  placeholder="{petName}这次和{charName}聊天消耗了{tokens}tk，用时{time}秒，第{floor}楼"></textarea>
        <div class="ai-pet-sp-hint">
          可用变量：<code>{petName}</code> <code>{charName}</code>
          <code>{tokens}</code> <code>{time}</code> <code>{floor}</code>
        </div>
      </div>
    </div>

    <!-- ── 数据管理 ── -->
    <div class="ai-pet-sp-section">
      <div class="ai-pet-sp-section__title">数据管理</div>
      <div class="ai-pet-sp-row ai-pet-sp-row--gap">
        <button class="ai-pet-sp-btn ai-pet-sp-btn--half" id="ai-pet-sp-export">
          📤 导出数据
        </button>
        <button class="ai-pet-sp-btn ai-pet-sp-btn--half ai-pet-sp-btn--danger" id="ai-pet-sp-clear">
          🗑️ 清空数据
        </button>
      </div>
    </div>

    <!-- ── 版本信息 ── -->
    <div class="ai-pet-sp-footer">
      AI桌宠系统 v1.0.0-phase1 · Phase 1 地基
    </div>

  </div><!-- /ai-pet-sp-body -->
</div><!-- /ai-pet-sp-wrap -->
